'情-情':{tag:'人间留灯者',animal:'deer',keys:'共情 · 重情 · 温柔',about:"你常会记住别人随口提过的小事：哪天有面试、最近睡不好、某样东西喜欢什么味道。你表达在意的方式往往很具体，可能是主动问候、留出时间，或在对方忙乱时把事情接过去。你建立信任靠的不是热闹，而是一次次可靠的回应。\n\n因为很会体会别人，你有时会先替对方找理由，自己的不舒服却往后放。也可能默默付出后，期待对方自然看懂你需要什么；当对方没察觉时，失望就累积起来。共情不等于必须负责解决每个人的问题。\n\n试着把“我希望你怎么做”说得具体些，也留意自己是否有余力再答应。你在关系里的温度很珍贵，清楚表达边界能让这份温柔持续，而不是变成勉强。",books:[['亲爱的生活','艾丽丝·门罗','从平常生活的转折写关系、记忆与选择。'],['小镇畸人','舍伍德·安德森','一组孤独人物彼此映照，写人对理解与连接的渴望。'],['边城','沈从文','以清澈含蓄的笔触描绘小地方的人情与命运。'],['台北人','白先勇','不同人物的生活切片，写记忆、身份与时代变迁。'],['伤心咖啡馆之歌','卡森·麦卡勒斯','孤独、爱与错位的依恋，短而余味悠长。'],['鳄鱼手记','邱妙津','日记体小说，坦率书写亲密、身份与自我撕扯。']]},
'行-行':{tag:'远路行者',animal:'horse',keys:'行动 · 开阔 · 坚韧',about:"遇到新机会时，你比较容易先迈出一步，再在过程中修正路线。报名、搬家、换项目、开始一段新计划，都可能让你感到“先试了才知道”。你不一定不害怕，只是不想让犹豫替自己做决定；行动之后，你通常能很快适应现场情况。\n\n你的长处是启动能力强、遇到变化不容易僵住，也愿意为选择承担后果。需要留意的是，新的目标可能比收尾更有吸引力；当一件事进入重复、缓慢的阶段，你容易怀疑自己是不是该换方向。\n\n在答应下一件事之前，可以先问：我是在走向想要的生活，还是只想离开眼下的不耐烦？给重要计划设一个短周期检查点，既保留探索空间，也能看见哪些事情值得继续投入。",books:[['路','科马克·麦卡锡','荒凉旅途中关于生存、亲情与坚持的普利策奖小说。'],['奥吉·马奇历险记','索尔·贝娄','漫长的人生闯荡，写个人如何在时代中寻找自己的路。'],['西线无战事','埃里希·玛丽亚·雷马克','年轻士兵的经历，呈现战争对一代人的摧毁。'],['奇风岁月','罗伯特·麦卡蒙','回望一个夏天里的成长、冒险与人生转折。'],['消失的地平线','詹姆斯·希尔顿','借远行探问归属、理想与另一种生活。'],['钢琴教师','埃尔弗里德·耶利内克','冷峻地呈现控制、压抑与个体挣脱的可能。']]},
'奇-奇':{tag:'暗潮观测者',animal:'fox',keys:'好奇 · 敏锐 · 独立',about:"你听到一个说法时，往往会留意它解释不了的部分。讨论里别人接受了一个结论，你可能会追问例外是什么、谁的经验没有被算进去。遇到新地方或新的人，你也会观察细节、找线索，因此常能发现别人略过的可能性。\n\n这种求异让你不容易被表面答案带着走，也使你愿意尝试不同的看法。不过，持续寻找隐藏含义会让简单的事变复杂；在关系里尤其如此，有时对方只是累了，并不一定是在暗示什么。\n\n可以把猜测和事实分开放：我实际看见了什么？我推测了什么？想确认时直接问，比独自解码更省力。你的好奇适合用来打开问题，不必让每个问题都变成谜题。",books:[['小径分岔的花园','豪尔赫·路易斯·博尔赫斯','短篇以迷宫、时间和选择打开多重可能。'],['白噪音','唐·德里罗','家庭生活、消费社会与死亡焦虑交织的讽刺小说。'],['审判','弗兰茨·卡夫卡','无法触及的规则构成一场荒诞而不安的寓言。'],['黑暗的心','约瑟夫·康拉德','一段深入未知之地的旅程，逐渐揭开文明与权力的阴影。'],['蛇结','弗朗索瓦·莫里亚克','一段内心独白慢慢显露家庭关系中的怨恨与秘密。'],['我的名字叫红','奥尔罕·帕慕克','谋杀、艺术史与多声部叙事交织，获国际IMPAC都柏林文学奖。']]},
'静-情':{tag:'月下听潮者',animal:'owl',keys:'细腻 · 深情 · 善感',about:"你通常不会立刻把情绪摊开来讲。你可能先在心里回放一次谈话，想清楚自己为什么被某句话触动，再决定要不要和对方说。真正亲近的人对你很重要，但你表达在乎的方式往往安静、细致，也需要对方愿意听那些尚未整理好的感受。\n\n你能同时看见自己的感受和对方的处境，因此很会体察关系里的细微变化。容易卡住的地方是：你等着对方察觉，而对方并不知道你已经想了很久；或是为了避免伤人，把自己的需求说得太含蓄。\n\n关系出现不确定时，试着先说一个具体观察，再说感受和请求，例如“这周我们没怎么联系，我有点想念你，能不能找时间聊聊？”这不会削弱你的克制，反而让敏感变成真正的连接。",books:[['到灯塔去','弗吉尼亚·伍尔夫','意识流动之间，写家庭、时间与未竟的情感。'],['爱无可忍','伊恩·麦克尤恩','从一次偶然事件写执念、亲密关系与失控。'],['一个陌生女人的来信','斯蒂芬·茨威格','一封信展开单向的爱、记忆与人生错位。'],['蓝花','佩内洛普·菲茨杰拉德','克制笔触写爱情、理想与生命转折。'],['正常人','萨莉·鲁尼','描摹两个人多年关系中的靠近、错过与改变。'],['情人','玛格丽特·杜拉斯','以回忆和节制的语言书写欲望与时间。']]},
'静-行':{tag:'清醒的远行者',animal:'crane',keys:'清醒 · 自持 · 有方向',about:"你不是想到就做的人，通常会先想清楚为什么要做、可能失去什么，再挑一个可行的起点。你可能会为转行做功课、先试一个小项目，或在做重大决定前和少数信任的人谈谈。准备对你有用，因为它能让行动更稳、更符合自己的方向。\n\n当你想清楚后，执行力往往不错，而且不太需要外界持续催促。困难在于，你可能把“还没完全准备好”当成继续等待的理由，尤其是结果不确定、又很在意成败时。\n\n把大决定拆成一个低成本的试验：约一次访谈、做一个周末版本、设两周观察期。你不必先获得百分之百的把握；让行动提供新信息，思考就有真实材料可以依据。",books:[['刀锋','毛姆','借人物的生活转向，讨论世俗成功与精神追寻。'],['人性的枷锁','毛姆','成长经历里的选择、执念与摆脱束缚。'],['第二十二条军规','约瑟夫·海勒','荒诞讽刺制度困境，获美国国家图书奖。'],['记忆记忆','玛丽亚·斯捷潘诺娃','从家族档案与私人记忆追问个体如何理解历史。'],['阿尔特米奥·克罗斯之死','卡洛斯·富恩特斯','临终回望人生与权力，结构多层，适合慢读。'],['地下室手记','陀思妥耶夫斯基','尖锐内心独白，探问自由、行动与自我矛盾。']]},
'情-行':{tag:'人间远行者',animal:'dog',keys:'陪伴 · 勇敢 · 认真',about:"当身边的人遇到困难，你往往不只说“我支持你”，还会问要不要陪着去、帮忙查路线，或一起把下一步安排出来。你喜欢和重要的人共同经历事情，也愿意为了关系调整计划。对你而言，陪伴常常是一种实际行动。\n\n这让你可靠、有担当，也容易让别人感到有人同行。需要留意的是，热心解决问题有时会快过倾听：对方可能只是想把感受说出来，不一定现在就想要方案。你也可能把自己的行程和精力排满，后来才发现没有给自己留余地。\n\n先问一句“你想让我听你说，还是一起想办法？”能让你的行动更贴合对方需要。答应帮忙前也确认时间和能力，让同行成为自愿的选择，而不是长期默认由你扛着走。",books:[['赎罪','伊恩·麦克尤恩','误解、愧疚与时间如何改变一段关系。'],['绿房子','马里奥·巴尔加斯·略萨','多线叙事交织边地人物与命运，作者获诺贝尔文学奖。'],['追风筝的人','卡勒德·胡赛尼','友情、愧疚、远行与补偿交织的故事。'],['离开的，留下的','埃莱娜·费兰特','从友谊写女性在成长、亲密与自我选择中的变化。'],['宽恕','伊恩·麦克尤恩','一次旅行与意外引出关系中的责任和道德选择。'],['我们仨','杨绛','平实克制地回望家庭、陪伴与离别。']]},
'情-奇':{tag:'人间拾梦者',animal:'rabbit',keys:'共情 · 想象 · 灵动',about:"你容易被有反差、有故事的人吸引。聊天时你不只听事件本身，也会好奇对方为何这样选择、他没说出口的顾虑是什么。你会把不同人的经历联系起来，也愿意听不熟悉的观点，因此常能进入一段原本与你很远的故事。\n\n你的想象力和共情力让你看见复杂性，不急着把人归成好坏两类。另一面是，太多可能解释会让你替别人补完动机；你可能把偶然当成暗示，或因为理解对方而忽略了实际行为给你的感受。\n\n保留好奇，也给事实留位置。你可以问对方，而不是只在心里推演；判断一段关系时，看看长期做了什么，不只看故事听起来多动人。这样你的敏锐能帮助理解，而不是让你困在猜想里。",books:[['大师与玛格丽特','米哈伊尔·布尔加科夫','现实、讽刺与奇幻交织，写欲望、权力和信念。'],['梦游者','赫尔曼·布洛赫','以多人物、多层结构呈现价值体系的崩塌。'],['米格尔街','V. S. 奈保尔','一组邻里人物的故事，幽默里带着失落与洞察。'],['群山回唱','卡勒德·胡赛尼','多视角、跨年代的家族秘密与命运回声。'],['茨威格小说选','斯蒂芬·茨威格','心理变化与命运转折构成精巧、紧凑的故事。'],['霍乱时期的爱情','加西亚·马尔克斯','以漫长岁月写爱情、等待与人的复杂选择。']]},
'行-奇':{tag:'荒原探路人',animal:'wolf',keys:'探索 · 果断 · 不循常路',about:"熟悉的方法失灵时，你常愿意换条路试试。你可能主动接下陌生任务、研究一个新领域，或在大家沿用旧流程时提出替代做法。你喜欢亲自验证想法，单靠“以前一直这样”很难说服你。变化对你而言既是风险，也是一种信息来源。\n\n你有开路和解决突发问题的能力，面对未知时比许多人更容易进入状态。但持续追求新鲜也可能让你低估维护成本：一个新点子启动很快，后续协作、收尾和重复工作却需要耐心。\n\n尝试新路时，为自己设清楚边界：投入多少时间、出现什么信号就继续或暂停、谁会受到影响。这样既不会压住探索欲，也能让冒险变成可承担的实验。",books:[['黑暗的左手','厄休拉·勒古恩','借科幻世界讨论性别、政治与理解他者，获雨果奖和星云奖。'],['索拉里斯星','斯坦尼斯瓦夫·莱姆','以未知星球追问人类是否能理解异质生命。'],['冰','安娜·卡文','梦魇般的末世旅程，语言独特、气氛冷冽。'],['我们','叶甫盖尼·扎米亚京','反乌托邦经典，写个体、秩序与自由。'],['沙丘','弗兰克·赫伯特','生态、政治与预言交织的宏大科幻世界。'],['第五号屠场','库尔特·冯内古特','以非线性与黑色幽默处理战争、记忆和时间。']]},
'奇-静':{tag:'雾中观星者',animal:'hare',keys:'观察 · 留白 · 想象',about:"你常先观察，再决定要不要参与。别人聊天时你可能不急着插话，却会记下一个用词、一处反常，之后独自琢磨它和其他细节有什么联系。你对梦、象征、旧物或看似偶然的相遇有兴趣，常能从普通场景里看到多层意味。\n\n独处给你空间，把散落的信息慢慢组合成自己的理解；这适合创作、研究和深度思考。容易卡住的是，想法在脑中越长越完整，却没有及时拿到现实里验证；你也可能因为还没想好怎么表达，就一直没有开口。\n\n把观察先写成几条，再挑一个最值得验证的问题。和别人分享时不必讲成完整理论，从“我注意到一件小事”开始就够了。你的洞察不必等到完美成形才有价值。",books:[['看不见的城市','伊塔洛·卡尔维诺','用想象之城开启关于记忆、欲望与生活的思考。'],['海边的卡夫卡','村上春树','成长、孤独与神秘意象交织的长篇小说。'],['变形记','弗兰茨·卡夫卡','日常突然变形，呈现个体与世界之间的疏离。'],['克拉拉与太阳','石黑一雄','以克制视角写意识、爱与人的局限。'],['昨日的世界','斯蒂芬·茨威格','以个人记忆回望一个消逝的欧洲世界。'],['象棋的故事','斯蒂芬·茨威格','在封闭空间与心理对弈中探索孤独和意识']]}
};

let idx=0,answers=Array(qs.length).fill(null);const $=x=>document.getElementById(x);function showQuestion(){const [q,opts]=qs[idx];const order=permutations[(idx*7+3)%permutations.length];const choices=order.map(axis=>({axis,text:opts[axes.indexOf(axis)]}));$('qnum').textContent=`第 ${String(idx+1).padStart(2,'0')} 题`;$('counter').textContent=`${idx+1} / ${qs.length}`;$('bar').style.width=`${(idx+1)/qs.length*100}%`;$('question').textContent=q;$('answers').innerHTML=choices.map(({axis,text},i)=>`<button class="answer ${answers[idx]===axis?'selected':''}" data-axis="${axis}"><span class="letter">${'ABCD'[i]}</span><span>${text}</span></button>`).join('');document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{answers[idx]=b.dataset.axis;showQuestion()});$('prev').disabled=idx===0;$('next').textContent=idx===qs.length-1?'查看结果 →':'下一题 →';$('next').disabled=answers[idx]===null;$('qcontent').classList.remove('fade');void $('qcontent').offsetWidth;$('qcontent').classList.add('fade')}
$('begin').onclick=()=>{$('start').style.display='none';$('quiz').style.display='block';showQuestion();window.scrollTo(0,0)};$('prev').onclick=()=>{if(idx>0){idx--;showQuestion()}};$('next').onclick=()=>{if(idx<qs.length-1){idx++;showQuestion()}else showResult()};
function showResult(){const scores=[0,0,0,0];answers.forEach(a=>scores[axes.indexOf(a)]++);const order=scores.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v);let x=axes[order[0].i],y=axes[order[1].i];const primary=x,secondary=y;const pure=order[0].v-order[1].v>=6;if(['情-静','行-静','奇-静','行-情','奇-情','奇-行'].includes(`${x}-${y}`))[x,y]=[y,x];let data=pure?results[`${primary}-${primary}`]:results[`${x}-${y}`];if(!data)data=results[`${y}-${x}`];if(!data)data=results[`${x}-${x}`];x=primary;y=secondary;const paragraphs=data.about.split('\n\n').map(p=>`<p>${p}</p>`).join('');const mix=pure?`你的答案明显聚集在「${x}」这一倾向上，因此结果呈现为一个比较鲜明的主色调。${axisInfo[x][0]}是你处理问题和感受生活时常用的方式；第二高的「${y}」则像一层次要颜色，会在特定关系或情境里显现。`:`你的主倾向「${x}」是底色，副倾向「${y}」让这个底色有了自己的纹理。前者更常影响你第一时间的反应，后者则补充了你如何与人相处、面对变化或理解未知。两者并不是互相矛盾的性格标签，而是会一起出现的两种习惯。`;const axisCards=axes.map((a,i)=>`<article class="axis-card"><b>${a} · ${axisInfo[a][0]}</b><p>${axisInfo[a][1]}</p><small>${scores[i]} / 40</small></article>`).join('');$('quiz').style.display='none';$('result').style.display='block';$('result').innerHTML=`<div class="resulthead fade"><div><div class="tag">你的性格 Tag</div><h1>#${data.tag}</h1><div class="keywords">${data.keys}</div></div><div class="animal"><svg viewBox="0 0 160 145" role="img" aria-label="${data.tag}的简笔动物插画"><g>${animalDrawings[data.animal]}</g></svg></div></div><div class="resultbody"><h2>你的内心画像</h2>${paragraphs}<h2>这两种倾向如何组成你</h2><p>${mix}</p><p>这份结果不是给你定型，而是提供一个观察自己的角度。你可能在熟悉的人面前更显出「${y}」，独处或遇到选择时则更像「${x}」。书单也按这种组合来挑：既照顾你最熟悉的内在节奏，也留出一点空间，给你还没走过的方向。</p><h2>四个倾向分别代表什么</h2><p>下面显示你在四种倾向上的分布。分数越高，表示本次作答中越常选择与这一倾向相近的选项；它不代表优劣，也不是固定人格诊断。</p><div class="axis-grid">${axisCards}</div><h2>适合你的文学书单</h2><p>这些作品按你的性格气质挑选，包含不同国家、年代与叙事风格。可以先从最吸引你的一本开始，不必把它们读成清单任务。</p><div class="books">${data.books.map(b=>`<article class="book"><strong>${b[0]}</strong><span>${b[1]}</span><p>${b[2]}</p></article>`).join('')}</div><p class="shareline">主倾向：${x} ${scores[axes.indexOf(x)]}题 · 次倾向：${y} ${scores[axes.indexOf(y)]}题</p><div class="actions"><button class="btn" onclick="restart()">再测一次</button><button class="btn light" onclick="window.print()">保存 / 打印结果</button></div></div>`;window.scrollTo(0,0)}function restart(){idx=0;answers.fill(null);$('result').style.display='none';$('start').style.display='block';window.scrollTo(0,0)}
</script></body></html>
